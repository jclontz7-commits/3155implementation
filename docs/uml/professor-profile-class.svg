="32" y="107.645" fill="#000" font-size="14" textLength="97.18">+id: UUID {PK}</text><text x="32" y="124.133" fill="#000" font-size="14" textLength="161.622">+professorId: UUID {FK}</text><text x="32" y="140.621" fill="#000" font-size="14" textLength="86.324">+title: String</text><text x="32" y="157.109" fill="#000" font-size="14" textLength="136.035">+description: String</text><text x="32" y="173.598" fill="#000" font-size="14" textLength="123.396">+duration: String?</text><text x="32" y="190.086" fill="#000" font-size="14" textLength="107.488">+hoursMin: Int?</text><text x="32" y="206.574" fill="#000" font-size="14" textLength="111.07">+hoursMax: Int?</text><text x="32" y="223.063" fill="#000" font-size="14" textLength="148.654">+deadline: DateTime?</text><text x="32" y="239.551" fill="#000" font-size="14" textLength="184.762">+status: OpportunityStatus</text><text x="32" y="256.039" fill="#000" font-size="14" textLength="172.655">+publishedAt: DateTime?</text></g><g class="entity" data-qualified-name="Scope" id="ent0009" data-source-line="56"><path d="M241,97.988 L241,215.162 L680.114,215.162 L680.114,107.988 L670.114,97.988 L241,97.988" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M670.114,97.988 L670.114,107.988 L680.114,107.988 L670.114,97.988" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="247" y="115.557" fill="#000" font-size="13" textLength="341.694">Implemented profile UI uses owner-only API methods.</text><text x="247" y="130.867" fill="#000" font-size="13" textLength="335.543">Posted list filters status = PUBLISHED before limiting.</text><text x="247" y="146.178" fill="#000" font-size="13" textLength="385.817">Text and photo updates require the expected profile version.</text><text x="247" y="161.488" fill="#000" font-size="13" textLength="387.118">Photos: valid decoded PNG/JPEG/WebP, nonempty, &lt;= 2 MiB.</text><text x="247" y="176.799" fill="#000" font-size="13" textLength="418.114">File bytes live in ignored .dev/uploads; metadata is in PostgreSQL.</text><text x="247" y="192.109" fill="#000" font-size="13" textLength="359.931">The sample-professor session is local development only.</text><text x="247" y="207.42" fill="#000" font-size="13" textLength="351.673">Full shared schema appears in shared-data-class.puml.</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk5" data-link-type="dependency"><polygon points="136.18,872.461,136.377,862.614,134.241,867.852,129.003,865.716,136.18,872.461" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M109.094,581.514 C104.085,652.033 103.191,740.24 118.5,817.488 C122.164,835.975 126.998,850.636 134.241,867.852" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="120.5" y="732.057" fill="#000" font-size="13" textLength="38.632">owner</text><text x="127.18" y="869.029" fill="#000" font-size="13">1</text><text x="84.094" y="595.082" fill="#000" font-size="13" textLength="24.667">0..1</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk6" data-link-type="dependency"><polygon points="202.77,872.427,211.127,867.215,205.572,868.286,204.501,862.731,202.77,872.427" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M239.858,817.613 C227.25,836.248 217.102,851.245 205.572,868.286" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="225.5" y="850.057" fill="#000" font-size="13" textLength="38.632">owner</text><text x="193.77" y="868.995" fill="#000" font-size="13">1</text><text x="216.858" y="831.182" fill="#000" font-size="13" textLength="22.712">0..*</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-link-type="dependency"><polygon points="242.972,636.101,241.49,626.365,240.277,631.89,234.752,630.677,242.972,636.101" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="